<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đánh Giá Sản Phẩm | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div th:replace="~{view/admin_sidebar :: sidebar('product')}"></div>

    <div class="main-content">
        <div class="header-top">
            <h1>Phân Tích Đánh Giá Của Khách Hàng</h1>
            <div class="admin-profile">
                Chào, <span><span th:text="${session.userSession != null ? session.userSession.email : ''}"></span></span>
                <span class="admin-badge">ADMIN</span>
            </div>
        </div>

        <div class="content-body">
            <div id="content-main">
                <a th:href="@{/AdminDashboard}" class="btn-back" style="margin-bottom: 25px;"><i class="fas fa-arrow-left"></i> Trở Về Bảng Điều Khiển</a>

                <div th:if="${productDetail != null}" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; margin-bottom: 25px; display: flex; align-items: center; gap: 20px;">
                    <img th:src="@{'/images/' + ${productDetail.pimage}}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid #e2e8f0;" onerror="this.src='https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=100'">
                    <div>
                        <h2 style="margin: 0 0 5px 0; color: #1e293b;" th:text="${productDetail.pname}"></h2>
                        <p style="margin: 0; color: #64748b; font-size: 14px;">Mã SP: <strong>#<span th:text="${productDetail.id}"></span></strong> | Lượt bán: <strong style="color: #10b981;" th:text="${productDetail.sold != null ? productDetail.sold : 0} + ' bông'"></strong></p>
                    </div>
                </div>

                <div class="table-card" style="margin-top: 0;">
                    <div class="table-header">
                        <h3><i class="fas fa-comments" style="color: #d63384; margin-right: 8px;"></i> Lịch Sử Phản Hồi Từ Khách Hàng</h3>
                    </div>
                    
                    <th:block th:if="${listReviews != null && !listReviews.empty}">
                        <div class="admin-search-wrapper">
                            <div class="admin-search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Tìm kiếm đánh giá..." onkeyup="filterAdminTable(this)">
                            </div>
                        </div>
                        <table style="width: 100%;">
                            <thead>
                                <tr>
                                    <th>Khách hàng</th>
                                    <th>Số sao</th>
                                    <th>Nội dung bình luận</th>
                                    <th>Thời gian đánh giá</th>
                                    <th style="text-align: center;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <th:block th:each="r : ${listReviews}">
                                    <tr>
                                        <td>
                                            <strong style="color: #1e293b;"><span th:text="${r.fullname}"></span></strong><br>
                                            <span style="font-size: 12px; color: #94a3b8;"><span th:text="${r.email}"></span></span>
                                        </td>
                                        <td style="color: #f59e0b; font-size: 13px;">
                                            <th:block th:if="${r.rating != null && r.rating > 0}" th:each="star : ${#numbers.sequence(1, r.rating)}">
                                                <i class="fas fa-star"></i>
                                            </th:block>
                                        </td>
                                        <td style="color: #4a5568; font-style: italic;">"<span th:text="${r.comment}"></span>"</td>
                                        <td style="color: #64748b; font-size: 13px;" th:text="${r.review_date}"></td>
                                        <td style="text-align: center;">
                                            <form th:action="@{/Admin/DeleteReview}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc muốn xóa đánh giá này không?');">
                                                <input type="hidden" name="reviewId" th:value="${r.reviewId}">
                                                <input type="hidden" name="pid" th:value="${productDetail.id}">
                                                <button type="submit" style="background:#fee2e2; color:#dc2626; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">
                                                    <i class="fas fa-trash-alt"></i> Xóa
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </th:block>
                            </tbody>
                        </table>
                    </th:block>
                    
                    <div th:unless="${listReviews != null && !listReviews.empty}" style="text-align: center; padding: 50px; color: #94a3b8;">
                        <i class="fas fa-comment-slash" style="font-size: 40px; margin-bottom: 15px; display: block; opacity: 0.5;"></i>
                        Sản phẩm này hiện chưa có lượt đánh giá nào từ khách hàng.
                    </div>
                </div>
            </div>

            <div th:replace="~{view/admin_chat_layout :: body}"></div>
        </div>
    </div>

    <script th:inline="javascript">
        window.addEventListener('DOMContentLoaded', function () {
            /*[# th:if="${msgSuccess != null}"]*/
            Swal.fire({icon: 'success', title: 'Thành công!', text: /*[[${msgSuccess}]]*/ '', confirmButtonColor: '#10b981'});
            /*[/]*/
            /*[# th:if="${msgError != null}"]*/
            Swal.fire({icon: 'error', title: 'Thông báo', text: /*[[${msgError}]]*/ '', confirmButtonColor: '#ef4444'});
            /*[/]*/
        });
    </script>
    <script th:src="@{/js/admin-search.js}"></script>
</body>
</html>
