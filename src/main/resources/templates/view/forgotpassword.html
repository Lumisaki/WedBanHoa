<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khôi Phục Mật Khẩu | Tiệm Năm Hoa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" th:href="@{/css/loginregister.css}" href="/css/loginregister.css">
</head>
<body>
    <div class="forgot-container">
        <div class="brand-logo">Tiệm Năm Hoa</div>
        <p style="text-align: center; color: #64748b; margin-top: 0; margin-bottom: 35px; font-weight: 500; font-size: 14px;">Nhập thông tin xác thực để đặt lại mật khẩu</p> 
        <form th:action="@{/forgot}" method="post">
            <div class="input-group">
                <label for="email">Nhập Email đăng nhập của bạn:</label>
                <input type="email" name="email" id="email" placeholder="Nhập email của bạn..." required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>

            <div class="input-group">
                <label for="answer">Nhập câu trả lời bảo mật của bạn:</label>
                <input type="text" name="answer" id="answer" placeholder="Câu trả lời lúc bạn đăng ký..." required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>

            <div class="input-group">
                <label for="newPassword">Mật khẩu mới:</label>
                <input type="password" name="newPassword" id="newPassword" placeholder="Nhập mật khẩu mới..." required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            <button type="submit" class="btn-reset"><i class="fas fa-key"></i> ĐỔI MẬT KHẨU TÀI KHOẢN</button>
        </form>
        <a th:href="@{/Login}" class="back-to-login"><i class="fas fa-arrow-left"></i> Quay lại trang Đăng nhập</a>
    </div>
    <script th:inline="javascript">
        window.onload = function() {
            /*[# th:if="${msg != null}"]*/
            Swal.fire({ icon: 'error', title: 'Thất bại', text: /*[[${msg}]]*/ '', confirmButtonColor: '#d63384' });
            /*[/]*/
            /*[# th:if="${error != null}"]*/
            Swal.fire({ icon: 'error', title: 'Lỗi xác thực', text: /*[[${error}]]*/ '', confirmButtonColor: '#d63384' });
            /*[/]*/
        }
    </script>
</body>
</html>
