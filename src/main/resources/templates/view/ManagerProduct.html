<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sản Phẩm | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>

    <div th:replace="~{view/admin_sidebar :: sidebar('product')}"></div>

    <div class="main-content">
        <div class="header-top">
            <h1>Trang Quản Trị Hệ Thống</h1>
            <div class="admin-profile">
                Chào, <span><span th:text="${session.userSession != null ? session.userSession.email : ''}"></span></span>
                <span class="admin-badge">ADMIN</span>
            </div>
        </div>

        <div class="content-body">
            <div id="content-main">
                <div class="table-card">
                    <div class="table-header">
                        <h3>
                            <i class="fas fa-boxes" style="color: #d63384;"></i> Quản Lý Danh Mục 
                            <span class="count-badge">Tổng: <span th:text="${listP != null ? listP.size() : 0}"></span> sản phẩm</span>
                        </h3>
                        <a th:href="@{/addProduct(from='manager')}" class="btn-add"><i class="fas fa-plus"></i> THÊM HOA MỚI</a>
                    </div>
                    
                    <th:block th:if="${listP != null && !listP.empty}">
                        <div class="admin-search-wrapper">
                            <div class="admin-search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Tìm kiếm nhanh..." onkeyup="filterAdminTable(this)">
                            </div>
                        </div>
                        <table style="width: 100%; white-space: nowrap;">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Giá gốc</th>
                                    <th>Giảm giá</th>
                                    <th>Giá sau giảm</th>
                                    <th>Kho (Thực)</th>
                                    <th>Đã bán</th>
                                    <th style="text-align: center;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <th:block th:each="o : ${listP}">
                                    <tr>
                                        <td style="color: #94a3b8; font-weight: bold;">#<span th:text="${o.id}"></span></td>
                                        <td>
                                            <img th:src="@{'/images/' + ${o.pimage}}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" onerror="this.src='https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=100'">
                                        </td>
                                        <td style="font-weight: 600; white-space: normal;" th:text="${o.pname}"></td>
                                        <td style="color: #64748b; text-decoration: line-through;" th:text="${#numbers.formatDecimal(o.pprice, 0, 'COMMA', 0, 'POINT') + 'đ'}"></td>
                                        <td><span style="background: #fee2e2; color: #dc2626; padding: 4px 8px; border-radius: 4px; font-weight: bold;" th:text="'-' + ${o.discount} + '%'"></span></td>
                                        <td style="color: #10b981; font-weight: bold;" th:text="${#numbers.formatDecimal(o.pprice * (1 - o.discount / 100.0), 0, 'COMMA', 0, 'POINT') + 'đ'}"></td>
                                        
                                        <td>
                                            <span th:if="${o.pstock != null && o.pstock > 0}" style="background: #e3fcef; color: #00875a; padding: 4px 8px; border-radius: 4px; font-weight: bold;" th:text="'Còn ' + ${o.pstock} + ' bó'"></span>
                                            <span th:unless="${o.pstock != null && o.pstock > 0}" style="background: #fee2e2; color: #dc2626; padding: 4px 8px; border-radius: 4px; font-weight: bold;">Hết Hàng</span>
                                        </td>
                                        
                                        <td style="color: #f59e0b; font-weight: bold;" th:text="${o.sold != null ? o.sold : 0} + ' bó'"></td>
                                        
                                        <td style="text-align: center;">
                                            <a th:href="@{/loadProduct(pid=${o.id}, from='manager')}" style="color: #4f46e5; margin-right: 15px; font-size: 16px;" title="Sửa"><i class="fas fa-edit"></i> Sửa</a>
                                            <a href="#" th:onclick="'confirmDelete(' + ${o.id} + ', \'manager\')'" style="color: #ff4757; font-size: 16px;" title="Xóa"><i class="fas fa-trash-alt"></i> Xóa</a>
                                        </td>
                                    </tr>
                                </th:block>
                            </tbody>
                        </table>
                        <div th:if="${totalPages != null && totalPages > 1}" class="pagination-wrapper">
                            <a th:href="@{${pageUrlPattern} + ${currentPage - 1}}" th:classappend="${currentPage == 1 ? 'disabled' : ''}" class="pagination-btn"><i class="fas fa-chevron-left"></i> Lùi</a>
                            <th:block th:each="pNum : ${#numbers.sequence(1, totalPages)}">
                                <a th:href="@{${pageUrlPattern} + ${pNum}}" th:classappend="${currentPage == pNum ? 'active' : ''}" th:text="${pNum}" class="pagination-btn"></a>
                            </th:block>
                            <a th:href="@{${pageUrlPattern} + ${currentPage + 1}}" th:classappend="${currentPage == totalPages ? 'disabled' : ''}" class="pagination-btn">Tiến <i class="fas fa-chevron-right"></i></a>
                        </div>
                    </th:block>
                    
                    <div th:unless="${listP != null && !listP.empty}" style="text-align: center; padding: 50px; color: #94a3b8;">
                        <i class="fas fa-box-open" style="font-size: 40px; margin-bottom: 15px; display: block;"></i>
                        Chưa có sản phẩm nào trong hệ thống. Hãy thêm mới!
                    </div>
                </div>
            </div>

            <!-- Form ẩn để submit delete -->
            <form id="deleteForm" th:action="@{/DeleteProduct}" method="post" style="display:none;">
                <input type="hidden" id="deletePid" name="pid">
                <input type="hidden" id="deleteFrom" name="from">
            </form>

            <div th:replace="~{view/admin_chat_layout :: body}"></div>
        </div>
    </div>

    <script th:inline="javascript">
        window.addEventListener('DOMContentLoaded', function() {
            /*[# th:if="${msgSuccess != null}"]*/
            Swal.fire({ icon: 'success', title: 'Thành công!', text: /*[[${msgSuccess}]]*/ '', confirmButtonColor: '#10b981' });
            /*[/]*/
            /*[# th:if="${msgError != null}"]*/
            Swal.fire({ icon: 'error', title: 'Lỗi thao tác!', text: /*[[${msgError}]]*/ '', confirmButtonColor: '#ef4444' });
            /*[/]*/
        });

        function confirmDelete(id, fromPage) {
            Swal.fire({
                title: 'Bạn có chắc chắn?',
                text: 'Sản phẩm này sẽ bị xóa khỏi hệ thống!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById("deletePid").value = id;
                    document.getElementById("deleteFrom").value = fromPage;
                    document.getElementById("deleteForm").submit();
                }
            });
        }
    </script>
    <script th:src="@{/js/admin-search.js}"></script>
</body>
</html>
