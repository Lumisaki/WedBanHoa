<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản | Tiệm Năm Hoa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" th:href="@{/css/loginregister.css}" href="/css/loginregister.css">
</head>
<body>
    <div class="register-container">
        <div class="brand-logo">Tiệm Năm Hoa</div>
        <p style="text-align: center; color: #64748b; margin-top: 0; margin-bottom: 35px; font-weight: 500; font-size: 14px;">Tạo tài khoản mới để trải nghiệm dịch vụ</p> 
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Họ và tên</label>
                <input type="text" name="fullname" placeholder="Nhập họ và tên của bạn" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Địa chỉ Email</label>
                <input type="email" name="email" placeholder="Nhập địa chỉ email" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Mật khẩu</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu bảo mật" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Số điện thoại</label>
                <input type="text" name="phone" placeholder="Nhập số điện thoại (Không bắt buộc)">
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Địa chỉ giao hàng</label>
                <input type="text" name="address" placeholder="Nhập địa chỉ của bạn (Không bắt buộc)">
            </div>
            <div class="input-group">
                <label for="question">Câu hỏi bảo mật (Dùng để lấy lại mật khẩu):</label>
                <select name="question" id="question" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="Loài hoa bạn yêu thích nhất là gì?">Loài hoa bạn yêu thích nhất là gì?</option>
                    <option value="Tên thú cưng đầu tiên của bạn là gì?">Tên thú cưng đầu tiên của bạn là gì?</option>
                    <option value="Thành phố bạn sinh ra ở đâu?">Thành phố bạn sinh ra ở đâu?</option>
                    <option value="Tên người bạn thân nhất thời thơ ấu?">Tên người bạn thân nhất thời thơ ấu?</option>
                </select>
            </div>

            <div class="input-group">
                <label for="answer">Câu trả lời bảo mật:</label>
                <input type="text" name="answer" id="answer" placeholder="Nhập câu trả lời của bạn..." required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> ĐĂNG KÝ TÀI KHOẢN</button>
        </form>
        <div class="back-to-login">Đã có tài khoản? <a th:href="@{/Login}">Đăng nhập ngay</a></div>
    </div>
    <script th:inline="javascript">
        window.onload = function() {
            /*[# th:if="${error != null}"]*/
            Swal.fire({ icon: 'error', title: 'Lỗi Đăng Ký', text: /*[[${error}]]*/ '', confirmButtonColor: '#d63384' });
            /*[/]*/
            /*[# th:if="${msg != null}"]*/
            Swal.fire({ icon: 'error', title: 'Cảnh báo', text: /*[[${msg}]]*/ '', confirmButtonColor: '#d63384' });
            /*[/]*/
        }
    </script>
</body>
</html>
