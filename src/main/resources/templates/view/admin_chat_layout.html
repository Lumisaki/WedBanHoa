<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="body">
<div id="content-chat" style="display: none;">
    <div class="chat-layout">
        <div class="chat-sidebar">
            <div class="chat-sidebar-header"><i class="fas fa-users"></i> Khách Hàng Trực Tuyến</div>
            <ul class="chat-user-list" id="chat-user-list"></ul>
        </div>
        <div class="chat-main">
            <div class="chat-main-header">
                <i class="fas fa-headset" style="color:#d63384;"></i> 
                <span>Đang kết nối tư vấn: <strong id="current-chat-name" style="color:#0284c7;">Chưa chọn khách hàng</strong></span>
            </div>
            <div class="chat-messages-area" id="admin-chat-messages">
                <div style="text-align:center; padding: 20px; color:#94a3b8;">Vui lòng chọn một khách hàng bên trái hộp thư để xem tin nhắn.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="admin-msg-input" placeholder="Nhập câu trả lời hỗ trợ...">
                <button onclick="sendAdminMessage()"><i class="fas fa-paper-plane"></i> Gửi</button>
            </div>
        </div>
    </div>
</div>
<!-- Nhúng logic JS -->
<script th:src="@{/js/admin-chat.js}" src="/js/admin-chat.js" charset="UTF-8"></script>
</div>
</body>
</html>
