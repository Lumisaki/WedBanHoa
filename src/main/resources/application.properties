spring.application.name=wedbanhoa
server.port=8080

# SQL Server Connection
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=wedbanhoa;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate_default_batch_size=20

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8





















# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB